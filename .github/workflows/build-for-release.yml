name: Build for release

on:
    workflow_dispatch:
        inputs:
            version_tag:
                description: 'Version tag for the release (e.g. v1.0.0)'
                required: true
                type: string
            prerelease:
                description: 'Mark as pre-release?'
                required: false
                type: boolean
                default: false
            draft:
                description: 'Mark as draft release?'
                required: false
                type: boolean
                default: false

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      runner: ubuntu-latest
                    - target: aarch64-unknown-linux-gnu
                      runner: ubuntu-24.04-arm
                    - target: x86_64-apple-darwin
                      runner: macos-15-intel
                    - target: aarch64-apple-darwin
                      runner: macos-14
                    - target: x86_64-pc-windows-msvc
                      runner: windows-latest
                    - target: aarch64-pc-windows-msvc
                      runner: windows-11-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 24

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                targets: ${{ matrix.target }}
            
            - name: Build backend
              run: cargo build --verbose --release --target ${{ matrix.target }}
            
            - name: Build frontend
              run: |
                npm install
                npm run build
              working-directory: ./frontend
            
            - name: Package release
              shell: bash
              run: |
                package_dir="release-${{ github.event.inputs.version_tag }}-${{ matrix.target }}"
                mkdir -p "$package_dir/frontend"
                cp "target/${{ matrix.target }}/release/local-network-file-transfer" "$package_dir/"
                cp -R frontend/dist "$package_dir/frontend/"
                tar -czf "$package_dir.tar.gz" "$package_dir"

            - name: Upload packaged release
              uses: actions/upload-artifact@v4
              with:
                name: release-${{ matrix.target }}
                path: release-${{ github.event.inputs.version_tag }}-${{ matrix.target }}.tar.gz

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download packaged releases
              uses: actions/download-artifact@v4
              with:
                path: release-assets
                pattern: release-*
                merge-multiple: true

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                tag_name: "${{ github.event.inputs.version_tag }}"
                name: "Release ${{ github.event.inputs.version_tag }}"
                prerelease: ${{ github.event.inputs.prerelease }}
                draft: ${{ github.event.inputs.draft }}
                files: |
                  release-assets/*.tar.gz
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
