[package]
name = "local-network-file-transfer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["multipart", "macros"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "trace", "decompression-gzip", "decompression-br", "decompression-zstd" ] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sanitize-filename = "0.6.0"
thiserror = "2.0.20"
anyhow = "1.0.104"
home = "0.5.12"
tokio-util = { version = "0.7", features = ["io"] }
